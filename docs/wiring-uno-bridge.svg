<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="640" rx="18" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1b1f24">Arduino Uno as the USB-UART adapter</text>
  <text x="40" y="80" font-size="15" fill="#57606a">Use with bw-flasher on your PC · dashboard unplugged · scooter switched ON</text>
  <rect x="790" y="30" width="130" height="30" rx="15" fill="#fff1c2"/><text x="855" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#9a6700">untested</text>

  <!-- board -->
  <rect x="80" y="140" width="460" height="300" rx="12" fill="#00727a"/>
  <rect x="50" y="175" width="70" height="60" rx="4" fill="#9aa4ae"/><text x="85" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#1b1f24">USB → PC</text>
  <rect x="220" y="250" width="200" height="56" rx="4" fill="#1b1f24"/><text x="320" y="283" text-anchor="middle" font-size="13" fill="#c7cdd4">ATmega328P (held in reset)</text>
  <text x="320" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">UNO</text>

  <!-- digital header (top) -->
  <g font-size="10" fill="#bfe3e6" text-anchor="middle">
    <circle cx="380" cy="152" r="5" fill="#bfe3e6"/><text x="380" y="176">7</text>
    <circle cx="400" cy="152" r="5" fill="#bfe3e6"/><text x="400" y="176">6</text>
    <circle cx="420" cy="152" r="5" fill="#bfe3e6"/><text x="420" y="176">5</text>
    <circle cx="440" cy="152" r="5" fill="#bfe3e6"/><text x="440" y="176">4</text>
    <circle cx="460" cy="152" r="5" fill="#bfe3e6"/><text x="460" y="176">3</text>
    <circle cx="480" cy="152" r="5" fill="#bfe3e6"/><text x="480" y="176">2</text>
  </g>
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="500" y="190">TX→1</text>
    <text x="522" y="208">RX←0</text>
  </g>
  <!-- power header (bottom) -->
  <g font-size="10" fill="#bfe3e6" text-anchor="middle">
    <circle cx="184" cy="428" r="5" fill="#bfe3e6"/><text x="184" y="414">IOREF</text>
    <circle cx="256" cy="428" r="5" fill="#bfe3e6"/>
    <circle cx="304" cy="428" r="5" fill="#bfe3e6"/>
    <circle cx="328" cy="428" r="5" fill="#bfe3e6"/><text x="328" y="414">VIN</text>
    <circle cx="390" cy="428" r="5" fill="#bfe3e6"/><circle cx="412" cy="428" r="5" fill="#bfe3e6"/><circle cx="434" cy="428" r="5" fill="#bfe3e6"/>
    <circle cx="456" cy="428" r="5" fill="#bfe3e6"/><circle cx="478" cy="428" r="5" fill="#bfe3e6"/><circle cx="500" cy="428" r="5" fill="#bfe3e6"/>
    <text x="445" y="414">A0 … A5</text>
  </g>
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="208" y="372">RESET</text>
    <text x="232" y="356">3.3V</text>
    <text x="280" y="372">GND</text>
    <text x="304" y="356">GND</text>
  </g>

  <!-- jumper RESET -> GND -->
  <path d="M208 428 C 208 398, 280 398, 280 428" fill="none" stroke="#8c959f" stroke-width="6" stroke-linecap="round"/>

  <!-- wires -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M500 152 V90 H715 V200 H760" stroke="#2e9d4f"/>
    <path d="M520 152 V108 H700 V255 H760" stroke="#e3b505"/>
    <path d="M232 428 V505 H715 V385 H760" stroke="#2f6fdb"/>
    <path d="M304 428 V488 H700 V440 H760" stroke="#24292f"/>
    <path d="M738 495 H760" stroke="#d1242f"/>
  </g>
  <g stroke="#fff" stroke-width="2">
    <circle cx="500" cy="152" r="8" fill="#2e9d4f"/>
    <circle cx="520" cy="152" r="8" fill="#e3b505"/>
    <circle cx="232" cy="428" r="8" fill="#2f6fdb"/>
    <circle cx="304" cy="428" r="8" fill="#24292f"/>
    <circle cx="208" cy="428" r="7" fill="#8c959f"/>
    <circle cx="280" cy="428" r="7" fill="#8c959f"/>
  </g>
  <g stroke="#d1242f" stroke-width="4" stroke-linecap="round"><line x1="724" y1="485" x2="744" y2="505"/><line x1="744" y1="485" x2="724" y2="505"/></g>

  <!-- cable -->
  <rect x="760" y="170" width="40" height="350" rx="8" fill="#3d444d"/>
  <text x="780" y="545" text-anchor="middle" font-size="12" fill="#57606a">M7 plug</text>
  <g font-size="14" fill="#1b1f24">
    <text x="815" y="196" font-weight="700">green</text><text x="815" y="213" font-size="12" fill="#57606a">ESC TX → TX→1</text>
    <text x="815" y="251" font-weight="700">yellow</text><text x="815" y="268" font-size="12" fill="#57606a">ESC RX → RX←0</text>
    <text x="815" y="381" font-weight="700">blue</text><text x="815" y="398" font-size="12" fill="#57606a">keep HIGH → 3.3V</text>
    <text x="815" y="436" font-weight="700">black</text><text x="815" y="453" font-size="12" fill="#57606a">GND</text>
    <text x="815" y="491" font-weight="700" fill="#d1242f">red</text><text x="815" y="508" font-size="12" fill="#d1242f">do NOT connect</text>
  </g>
  <text x="40" y="585" font-size="13" fill="#57606a">RESET→GND keeps the Uno's own chip silent, so its USB chip talks straight to pins 0 and 1.</text>
  <text x="40" y="606" font-size="13" fill="#57606a">Pin names are from the Uno's side: the ESC's TX goes to "TX→1". Same on a Nano (pins TX1 / RX0).</text>
</svg>
