<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="640" rx="18" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#1b1f24">ESP32 only: no dongle</text>
  <text x="40" y="80" font-size="15" fill="#57606a">Dashboard unplugged · scooter switched ON · ESP32 powered by USB from your PC</text>
  <g font-size="12" fill="#57606a"><rect x="760" y="30" width="160" height="30" rx="15" fill="#dafbe1"/><text x="840" y="50" text-anchor="middle" font-size="13" font-weight="600" fill="#1a7f37">tested: Scooter 5</text></g>

  <!-- board -->
  <rect x="70" y="110" width="250" height="470" rx="10" fill="#1f3a5f"/>
  <rect x="135" y="130" width="120" height="150" rx="6" fill="#c7cdd4"/>
  <text x="195" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#1f3a5f">ESP32</text>
  <text x="195" y="220" text-anchor="middle" font-size="11" fill="#1f3a5f">WROOM-32</text>
  <rect x="165" y="560" width="60" height="34" rx="4" fill="#9aa4ae"/>
  <text x="195" y="616" text-anchor="middle" font-size="12" fill="#57606a">USB → PC</text>
  <text x="195" y="550" text-anchor="middle" font-size="11" fill="#c7cdd4">DevKit V1 (30 pin), top view</text>

  <!-- left header (unused) -->
  <g font-size="11" fill="#8fa3b8">
    <circle cx="88" cy="130" r="5" fill="#8fa3b8"/><text x="100" y="134">EN</text>
    <circle cx="88" cy="158" r="5" fill="#8fa3b8"/><text x="100" y="162">VP</text>
    <circle cx="88" cy="186" r="5" fill="#8fa3b8"/><text x="100" y="190">VN</text>
    <circle cx="88" cy="214" r="5" fill="#8fa3b8"/><text x="100" y="218">D34</text>
    <circle cx="88" cy="242" r="5" fill="#8fa3b8"/><text x="100" y="246">D35</text>
    <circle cx="88" cy="270" r="5" fill="#8fa3b8"/><text x="100" y="274">D32</text>
    <circle cx="88" cy="298" r="5" fill="#8fa3b8"/><text x="100" y="302">D33</text>
    <circle cx="88" cy="326" r="5" fill="#8fa3b8"/><text x="100" y="330">D25</text>
    <circle cx="88" cy="354" r="5" fill="#8fa3b8"/><text x="100" y="358">D26</text>
    <circle cx="88" cy="382" r="5" fill="#8fa3b8"/><text x="100" y="386">D27</text>
    <circle cx="88" cy="410" r="5" fill="#8fa3b8"/><text x="100" y="414">D14</text>
    <circle cx="88" cy="438" r="5" fill="#8fa3b8"/><text x="100" y="442">D12</text>
    <circle cx="88" cy="466" r="5" fill="#8fa3b8"/><text x="100" y="470">D13</text>
    <circle cx="88" cy="494" r="5" fill="#8fa3b8"/><text x="100" y="498">GND</text>
    <circle cx="88" cy="522" r="5" fill="#8fa3b8"/><text x="100" y="526">VIN</text>
  </g>
  <!-- right header -->
  <g font-size="11" fill="#8fa3b8" text-anchor="end">
    <circle cx="302" cy="130" r="5" fill="#8fa3b8"/><text x="290" y="134">D23</text>
    <circle cx="302" cy="158" r="5" fill="#8fa3b8"/><text x="290" y="162">D22</text>
    <circle cx="302" cy="186" r="5" fill="#8fa3b8"/><text x="290" y="190">TX0</text>
    <circle cx="302" cy="214" r="5" fill="#8fa3b8"/><text x="290" y="218">RX0</text>
    <circle cx="302" cy="242" r="5" fill="#8fa3b8"/><text x="290" y="246">D21</text>
    <circle cx="302" cy="270" r="5" fill="#8fa3b8"/><text x="290" y="274">D19</text>
    <circle cx="302" cy="298" r="5" fill="#8fa3b8"/><text x="290" y="302">D18</text>
    <circle cx="302" cy="410" r="5" fill="#8fa3b8"/><text x="290" y="414">D4</text>
    <circle cx="302" cy="438" r="5" fill="#8fa3b8"/><text x="290" y="442">D2</text>
    <circle cx="302" cy="466" r="5" fill="#8fa3b8"/><text x="290" y="470">D15</text>
    <circle cx="302" cy="522" r="5" fill="#8fa3b8"/><text x="290" y="526">3V3</text>
  </g>
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="end">
    <text x="290" y="330">D5</text>
    <text x="290" y="358">D17 (TX2)</text>
    <text x="290" y="386">D16 (RX2)</text>
    <text x="290" y="498">GND</text>
  </g>

  <!-- wires -->
  <g fill="none" stroke-width="7" stroke-linecap="round">
    <path d="M302 326 C 520 326, 540 250, 700 250" stroke="#e3b505"/>
    <path d="M302 354 C 520 354, 540 315, 700 315" stroke="#2f6fdb"/>
    <path d="M302 382 C 520 382, 540 380, 700 380" stroke="#2e9d4f"/>
    <path d="M302 494 C 520 494, 540 445, 700 445" stroke="#24292f"/>
    <path d="M640 510 L 700 510" stroke="#d1242f"/>
  </g>
  <g>
    <circle cx="302" cy="326" r="8" fill="#e3b505" stroke="#fff" stroke-width="2"/>
    <circle cx="302" cy="354" r="8" fill="#2f6fdb" stroke="#fff" stroke-width="2"/>
    <circle cx="302" cy="382" r="8" fill="#2e9d4f" stroke="#fff" stroke-width="2"/>
    <circle cx="302" cy="494" r="8" fill="#24292f" stroke="#fff" stroke-width="2"/>
  </g>
  <g stroke="#d1242f" stroke-width="4" stroke-linecap="round"><line x1="622" y1="498" x2="646" y2="522"/><line x1="646" y1="498" x2="622" y2="522"/></g>

  <!-- cable -->
  <rect x="700" y="220" width="40" height="320" rx="8" fill="#3d444d"/>
  <text x="720" y="565" text-anchor="middle" font-size="12" fill="#57606a">M7 plug</text>
  <g font-size="14" fill="#1b1f24">
    <text x="756" y="246" font-weight="700">yellow</text><text x="756" y="263" font-size="12" fill="#57606a">ESC RX</text>
    <text x="756" y="311" font-weight="700">blue</text><text x="756" y="328" font-size="12" fill="#57606a">keep HIGH or ESC turns off</text>
    <text x="756" y="376" font-weight="700">green</text><text x="756" y="393" font-size="12" fill="#57606a">ESC TX (open collector)</text>
    <text x="756" y="441" font-weight="700">black</text><text x="756" y="458" font-size="12" fill="#57606a">GND</text>
    <text x="756" y="506" font-weight="700" fill="#d1242f">red</text><text x="756" y="523" font-size="12" fill="#d1242f">power: do NOT connect</text>
  </g>
  <text x="480" y="616" text-anchor="middle" font-size="12" fill="#57606a">Colours are from our cable. Yours may differ: run probe.py first.</text>
</svg>
