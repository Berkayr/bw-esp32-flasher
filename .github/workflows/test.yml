name: Host tests
on: [push, pull_request]
permissions: read-all
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: scooterteam/bw-flasher
          ref: 8baeea1362494dd233ad993b1bfd27367d7dbdcb
          path: upstream-bw-flasher
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2 -r tools/requirements-build.txt
      - run: python -m compileall -q esp32 tools tests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - run: python tools/build_image.py
      - run: node --test web/test/*.mjs
      - run: python -m pytest -q tests
        env:
          BW_FLASHER_SRC: ${{ github.workspace }}/upstream-bw-flasher
